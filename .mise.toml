[tools]
node = "22"

[env]
NODE_ENV = "development"

# ---------- Docker (共通/web) ----------

[tasks."docker:base"]
description = "共通ベースイメージ(myapp-base:local)をビルド"
run = "docker build -f docker/common/Dockerfile.base -t myapp-base:local ./app"

[tasks."docker:dev"]
description = "開発環境を起動（base未ビルドなら先にビルド）"
depends = ["docker:base"]
run = "docker compose -f docker/dev/compose.yaml --env-file docker/dev/.env up"

[tasks."docker:dev:build"]
description = "開発用イメージを再ビルド"
depends = ["docker:base"]
run = "docker compose -f docker/dev/compose.yaml --env-file docker/dev/.env build"

[tasks."docker:dev:down"]
description = "開発環境を停止"
run = "docker compose -f docker/dev/compose.yaml --env-file docker/dev/.env down"

[tasks."docker:dev:down:v"]
description = "開発環境を停止し、ボリューム(node_modules/next cache含む)も削除"
run = "docker compose -f docker/dev/compose.yaml --env-file docker/dev/.env down -v"

[tasks."docker:dev:logs"]
description = "開発環境のログを表示"
run = "docker compose -f docker/dev/compose.yaml --env-file docker/dev/.env logs -f"

[tasks."docker:dev:shell"]
description = "webコンテナにシェルで入る"
run = "docker compose -f docker/dev/compose.yaml --env-file docker/dev/.env exec web sh"

[tasks."docker:prod"]
description = "本番相当を起動（base未ビルドなら先にビルド）"
depends = ["docker:base"]
run = "docker compose -f docker/prod/compose.yaml --env-file docker/prod/.env up -d --build"

[tasks."docker:prod:down"]
description = "本番相当を停止"
run = "docker compose -f docker/prod/compose.yaml --env-file docker/prod/.env down"

[tasks."docker:prod:logs"]
description = "本番相当のログを表示"
run = "docker compose -f docker/prod/compose.yaml --env-file docker/prod/.env logs -f"

# ---------- DB (開発用) ----------

[tasks."db:up"]
description = "DBコンテナのみ起動（初回はinitdb/配下のSQLが自動実行される）"
run = "docker compose -f docker/dev/compose.yaml --env-file docker/dev/.env up -d db"

[tasks."db:down"]
description = "DBコンテナを停止"
run = "docker compose -f docker/dev/compose.yaml --env-file docker/dev/.env stop db"

[tasks."db:wait"]
description = "DBがhealthyになるまで待機"
run = """
until docker compose -f docker/dev/compose.yaml --env-file docker/dev/.env exec -T db pg_isready -U "${POSTGRES_USER:-app}" -d "${POSTGRES_DB:-appdb}" >/dev/null 2>&1; do
  echo "waiting for db..."
  sleep 1
done
echo "db is ready"
"""

[tasks."db:reset"]
description = "DBボリュームを削除して作り直し、initdb/配下のSQLを再実行させる"
depends = ["db:down"]
run = """
docker compose -f docker/dev/compose.yaml --env-file docker/dev/.env down -v
mise run db:up
mise run db:wait
"""

[tasks."db:shell"]
description = "psqlでDBコンテナに接続"
run = "docker compose -f docker/dev/compose.yaml --env-file docker/dev/.env exec db psql -U app -d appdb"

[tasks."db:shell:db"]
description = "dbコンテナにシェルで入る(psqlではなくOSシェル)"
run = "docker compose -f docker/dev/compose.yaml --env-file docker/dev/.env exec db sh"

[tasks."db:apply"]
description = "任意のSQLファイルを手動実行（例: mise run db:apply -- db/migrations/003_add_col.sql）"
run = "docker compose -f docker/dev/compose.yaml --env-file docker/dev/.env exec -T db psql -U app -d appdb < {{arg(name=\"file\")}}"

[tasks."db:seed"]
description = "db/initdb/002_seed.sql を再実行（既存データはON CONFLICTでスキップ）"
run = "docker compose -f docker/dev/compose.yaml --env-file docker/dev/.env exec -T db psql -U app -d appdb < db/initdb/002_seed.sql"

[tasks."db:dump"]
description = "現在のDBをdb/backup.sqlにダンプ"
run = "docker compose -f docker/dev/compose.yaml --env-file docker/dev/.env exec -T db pg_dump -U app appdb > db/backup.sql"

# ---------- セットアップ ----------

[tasks.init]
description = "初回セットアップ: .envを配置してbaseイメージをビルドし、DBを初期化"
depends = ["docker:base"]
run = """
[ -f docker/dev/.env ] || cp docker/dev/.env.example docker/dev/.env
[ -f docker/prod/.env ] || cp docker/prod/.env.example docker/prod/.env
mise run db:up
mise run db:wait
"""
