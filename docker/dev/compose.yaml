name: summer-hackathon-2026-app-dev

services:
  web:
    build:
      context: ../../app
      dockerfile: ../docker/dev/Dockerfile
      args:
        BASE_IMAGE: myapp-base:local
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ../../app:/app
      - summer_hackathon_2026_web_node_modules:/app/node_modules
      - summer_hackathon_2026_web_next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy
    command: npm run dev

  db:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - summer_hackathon_2026_db_data_dev:/var/lib/postgresql/data
      - ../../db/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  summer_hackathon_2026_db_data_dev:
  summer_hackathon_2026_web_node_modules:
  summer_hackathon_2026_web_next_cache:
