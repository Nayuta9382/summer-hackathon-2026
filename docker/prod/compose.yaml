
name: summer-hackathon-2026-app-prod

services:
  web:
    build:
      context: ../../app
      dockerfile: ../docker/prod/Dockerfile
      args:
        BASE_IMAGE: myapp-base:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # 本番はDBを外部公開しない想定。必要なら POSTGRES_PORT を設定して有効化する。
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - summer_hackathon_2026_db_data_prod:/var/lib/postgresql/data
      - ../../db/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  summer_hackathon_2026_db_data_prod:
